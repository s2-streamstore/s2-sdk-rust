[package]
name = "s2-sdk"
description = "Rust SDK for S2"
version = "0.24.0"
edition = "2024"
license = "MIT"
keywords = ["s2", "durable", "streams", "client", "sdk"]
categories = ["api-bindings", "database"]
repository = "https://github.com/s2-streamstore/s2-sdk-rust"
homepage = "https://github.com/s2-streamstore/s2-sdk-rust"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[features]
_hidden = []

[dependencies]
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
async-stream = "0.3"
async-trait = "0.1"
bytes = "1.11"
futures = "0.3"
http = "1.4"
http-body-util = "0.1"
hyper = "1.8"
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http2",
    "native-tokio",
    "aws-lc-rs",
    "tls12",
] }
hyper-util = { version = "0.1", features = [
    "client-legacy",
    "tokio",
    "http1",
    "http2",
] }
prost = "0.14"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "std",
] }
s2-api = "0.27"
s2-common = "0.28"
secrecy = "0.10"
serde = { version = "1.0" }
serde_json = "1.0"
serde_urlencoded = "0.7"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.49", features = ["time", "macros", "io-util", "sync"] }
tokio-muxt = "0.7"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt", "codec"] }
tracing = "0.1"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.21", features = ["v4", "fast-rng"] }

[dev-dependencies]
assert_matches = "1.5"
rstest = "0.26"
test-context = { version = "0.5" }
tokio = { version = "1.49", features = ["full", "test-util"] }
tokio-shared-rt = "0.1"

[[example]]
# `doc-scrape-examples` requires *any* one example to specify the option.
name = "create_basin"
doc-scrape-examples = true
